{% comment %}Fixed navy navigation adapted from yaoyao-liu/personal-website.{% endcomment %}
<nav class="topnav" aria-label="Site navigation">
  <a class="topnav-brand" href="#about"><span class="i18n-zh">{{ site.title_zh }}</span><span class="i18n-en">{{ site.title }}</span></a>

  <div id="myLinks">
    {% include navigation.html %}
  </div>

  <div class="topnav-controls" role="group" aria-label="Display controls">
    <button type="button" data-language-toggle aria-label="Switch to English">EN</button>
    <button type="button" data-theme-toggle aria-label="切换到深色模式"><i class="fa-regular fa-moon" aria-hidden="true"></i></button>
  </div>

  <button type="button" class="icon" aria-label="Toggle navigation" aria-controls="myLinks" aria-expanded="false">
    <span class="icon-wrap">
      <i class="fa fa-bars icon-bars"></i>
      <i class="fa fa-xmark icon-xmark"></i>
    </span>
  </button>
</nav>

<script>
var links = document.getElementById('myLinks');
var menuButton = document.querySelector('.topnav button.icon');
var mobileNavigation = window.matchMedia('(max-width: 960px)');

function setMenuOpen(open) {
  var expanded = mobileNavigation.matches && open;
  links.classList.toggle('open', expanded);
  links.hidden = mobileNavigation.matches && !expanded;
  menuButton.classList.toggle('active', expanded);
  menuButton.setAttribute('aria-expanded', String(expanded));
}

menuButton.addEventListener('click', function() {
  setMenuOpen(!links.classList.contains('open'));
});
mobileNavigation.addEventListener('change', function() { setMenuOpen(false); });
setMenuOpen(false);

document.querySelectorAll('.topnav #myLinks a').forEach(function(link) {
  link.addEventListener('click', function() { setMenuOpen(false); });
});

var navLinks = Array.from(document.querySelectorAll('.topnav #myLinks a'));
var navTargets = navLinks.map(function(link) {
  return document.querySelector(link.getAttribute('href'));
}).filter(Boolean);

if ('IntersectionObserver' in window) {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      navLinks.forEach(function(link) {
        link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
      });
    });
  }, { rootMargin: '-15% 0px -75% 0px' });
  navTargets.forEach(function(target) { observer.observe(target); });
}
</script>
