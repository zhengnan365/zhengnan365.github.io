<section id="contact" class="contact-block">
  <h2><span class="i18n-zh">联系方式</span><span class="i18n-en">Contact</span></h2>
  <div class="contact-row"><i class="fa-solid fa-envelope" aria-hidden="true"></i><p><strong><span class="i18n-zh">邮箱：</span><span class="i18n-en">Email:</span></strong> <a href="mailto:{{ site.email }}">{{ site.email }}</a></p></div>
  <div class="contact-row"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><p><strong><span class="i18n-zh">地址：</span><span class="i18n-en">Address:</span></strong> <span class="i18n-zh">{{ site.data.contact.address_zh }}</span><span class="i18n-en">{{ site.data.contact.address_en }}</span></p></div>
  <div class="contact-row"><i class="fa-solid fa-building" aria-hidden="true"></i><p><strong><span class="i18n-zh">办公室：</span><span class="i18n-en">Office:</span></strong> <span class="i18n-zh">{{ site.data.contact.office_zh }}</span><span class="i18n-en">{{ site.data.contact.office_en }}</span></p></div>
</section>
