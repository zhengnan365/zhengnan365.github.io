# 研究方向：每项包含 title_zh/title_en 和 description_zh/description_en。
- title_zh: 多能互补综合能源系统设计集成
  title_en: Design and Integration of Multi-Energy Complementary Integrated Energy Systems
  description_zh: 围绕风光地热、氢氨醇、冷热电、多元储能协同的多能耦合综合能源系统，开展系统建模、集成设计及协同运行策略研究
  description_en: Focusing on multi-energy coupled integrated energy systems that coordinate wind, solar, geothermal, hydrogen, ammonia, methanol, cooling, heating, power, and diverse energy storage technologies, this research investigates system modeling, integrated design, and coordinated operation strategies
- title_zh: 低碳能源系统优化运行与智能调控
  title_en: Optimal Operation and Intelligent Control of Low-Carbon Energy Systems
  description_zh: 针对可再生能源出力不确定、用户侧负荷需求波动及系统极端复杂运行条件，开展多目标优化、不确定性分析、分布式鲁棒优化以及智能调控研究
  description_en: Addressing uncertainty in renewable energy generation, fluctuations in end-user load demand, and extreme and complex system operating conditions, this research investigates multi-objective optimization, uncertainty analysis, distributed robust optimization, and intelligent control
