- date: 2025
  text_zh: 主持江苏省自然科学基金青年项目，研究太阳能双化学链协同驱动的零碳排分布式供能系统。
  text_en: Awarded a Jiangsu Natural Science Foundation Young Scientists Fund project on solar dual chemical-looping zero-carbon distributed energy systems.
- date: 2024.06
  text_zh: 获评北京市优秀毕业生，并获得华北电力大学优秀博士论文。
  text_en: Named a Beijing Outstanding Graduate and received the Outstanding Doctoral Dissertation award from North China Electric Power University.
- date: 2023
  text_zh: 获博士研究生国家奖学金和华北电力大学校长奖学金。
  text_en: Received the National Scholarship for Doctoral Students and the President's Scholarship from North China Electric Power University.
