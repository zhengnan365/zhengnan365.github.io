paragraphs:
  - text_zh: 郑楠，男，中共党员，工学博士，讲师，硕士生导师。2024年6月毕业于华北电力大学动力工程及工程热物理专业（硕博连读），2023年8月至2024年8月在意大利比萨大学联合培养。主要从事多能互补综合能源系统设计与集成、低碳能源系统优化运行与智能调控研究。主持国家自然科学基金、江苏省自然科学基金等科研课题，作为主研人参与国家自然科学基金重大项目、面上项目等多项科研项目。在 Applied Energy、Energy Conversion and Management、Energy、Applied Thermal Engineering 等能源领域权威期刊发表学术论文50余篇，其中以第一作者或通讯作者发表 SCI、EI 等论文20余篇，申请或授权专利12项。发表省级教改论文2篇。Scopus 被引1150余次，H-index 达21。担任 Applied Energy、Energy Conversion and Management、Energy 等10余种国际期刊审稿人。指导本科生、研究生荣获多项国家级、省级竞赛奖项。
    text_en: Nan Zheng is a member of the Communist Party of China, a lecturer, and a master's supervisor. He received his Ph.D. in Power Engineering and Engineering Thermophysics from North China Electric Power University in June 2024 through a combined master's and doctoral program. From August 2023 to August 2024, he was a joint doctoral researcher at the University of Pisa, Italy. His research focuses on the design and integration of multi-energy complementary integrated energy systems and the optimal operation and intelligent control of low-carbon energy systems. He leads research projects funded by the National Natural Science Foundation of China and the Natural Science Foundation of Jiangsu Province and has served as a key researcher on several projects, including a Major Program and General Programs of the National Natural Science Foundation of China. He has published more than 50 academic papers in leading energy journals, including Applied Energy, Energy Conversion and Management, Energy, and Applied Thermal Engineering, with more than 20 SCI- or EI-indexed papers as first or corresponding author. He has filed or been granted 12 patents and published two provincial-level papers on teaching reform. His publications have received more than 1,150 citations in Scopus, with an H-index of 21. He serves as a reviewer for more than 10 international journals, including Applied Energy, Energy Conversion and Management, and Energy. Under his supervision, undergraduate and graduate students have received multiple awards in national and provincial competitions.
