# 长段落可使用 text_zh: >- 并在下一行缩进两个空格继续填写。
paragraphs:
  - text_zh: 郑楠，男，工学博士，讲师，硕士生导师，现任扬州大学电气与能源动力工程学院教师。2024 年 6 月毕业于华北电力大学动力工程及工程热物理专业（硕博连读），2023 年 8 月至 2024 年 8 月在意大利比萨大学联合培养。
    text_en: Nan Zheng is a lecturer and master's supervisor at the College of Electrical, Energy and Power Engineering, Yangzhou University. He received his Ph.D. in Power Engineering and Engineering Thermophysics from North China Electric Power University in June 2024 and completed joint doctoral training at the University of Pisa from August 2023 to August 2024.
  - text_zh: 主要从事多能互补综合能源系统设计与集成、低碳能源系统优化运行与智能调控研究，围绕风光地热、氢氨醇、冷热电和多元储能协同，开展燃料电池、ORC、sCO₂ 循环、电解槽等能源转换单元建模、系统集成设计、协同运行及多目标优化研究。主持或参与多项国家级和省部级科研项目，已发表学术论文 50 余篇，其中以第一作者或通讯作者发表 SCI、EI 等论文 20 余篇，申请或授权专利 12 项。
    text_en: His research focuses on integrated multi-energy system design and low-carbon energy system optimization and intelligent control. His work covers the coordination of wind, solar, geothermal, hydrogen, ammonia, methanol, cooling, heating, power, and multi-type energy storage, including modeling of fuel cells, ORC, supercritical CO₂ cycles, and electrolyzers, system integration, coordinated operation, and multi-objective optimization. He has led or participated in national and provincial research projects, published more than 50 academic papers including over 20 SCI/EI papers as first or corresponding author, and applied for or been granted 12 patents.
