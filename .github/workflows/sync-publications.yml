name: Sync publications

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Sync OpenAlex publications
        run: python scripts/sync_publications.py
      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- _data/publications.yml assets/data/site-data.json; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml assets/data/site-data.json
          git commit -m "chore: sync publications"
          git push
